<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacked by Lapsus$</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #00ff66;
            --accent-color: #ff0055;
            --font-stack: 'Courier New', Courier, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-stack);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Scanline Overlay */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .container {
            text-align: center;
            z-index: 3;
            padding: 20px;
            border: 1px solid rgba(0, 255, 102, 0.2);
            background: rgba(0, 0, 0, 0.85);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.15);
            max-width: 650px;
            width: 90%;
        }

        /* Glitch Text Effect */
        .glitch {
            font-size: 2.8rem;
            font-weight: bold;
            text-transform: uppercase;
            position: relative;
            color: var(--text-color);
            letter-spacing: 2px;
            animation: glitch-skew 1s infinite linear alternate-reverse;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 var(--accent-color);
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim 2s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 #00c3ff;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim2 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(12px, 9999px, 52px, 0); }
            20% { clip: rect(78px, 9999px, 92px, 0); }
            40% { clip: rect(34px, 9999px, 10px, 0); }
            60% { clip: rect(89px, 9999px, 98px, 0); }
            80% { clip: rect(15px, 9999px, 64px, 0); }
            100% { clip: rect(50px, 9999px, 5px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(65px, 9999px, 100px, 0); }
            20% { clip: rect(10px, 9999px, 40px, 0); }
            40% { clip: rect(80px, 9999px, 15px, 0); }
            60% { clip: rect(30px, 9999px, 75px, 0); }
            80% { clip: rect(5px, 9999px, 60px, 0); }
            100% { clip: rect(95px, 9999px, 20px, 0); }
        }

        .subtext {
            margin-top: 20px;
            font-size: 0.95rem;
            color: #888;
            line-height: 1.6;
        }

        .telegram-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            color: var(--bg-color);
            background-color: var(--text-color);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 2px;
            transition: all 0.2s ease;
        }

        .telegram-btn:hover {
            background-color: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 0 10px var(--accent-color);
        }

        /* Terminal Output Effect */
        .terminal {
            margin-top: 20px;
            text-align: left;
            font-size: 0.8rem;
            color: #555;
            border-top: 1px dashed #333;
            padding-top: 10px;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: var(--text-color);
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="glitch" data-text="Hacked by Lapsus$">Hacked by Lapsus$</div>
        
        <p class="subtext">
            Your infrastructure has been compromised.<br>
            All source code, internal databases, and private keys have been exfiltrated.
        </p>
    </div>

</body>
</html>
